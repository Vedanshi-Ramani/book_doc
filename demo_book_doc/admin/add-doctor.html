<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Doctor | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 bg-dark text-white min-vh-100 p-4">
                <h4 class="fw-bold mb-4">Admin Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white active" href="add-doctor.html">Doctors</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="#">Appointments</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="#">Patients</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="login.html">Logout</a></li>
                </ul>
            </div>
            <div class="col-lg-10 p-4">
                <h2 class="fw-bold mb-4">Add Doctor</h2>
                <div class="card border-0 shadow rounded-4 p-4">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><label for="txtDoctorImage" class="form-label">Doctor Image</label><input type="file" id="txtDoctorImage" name="DoctorImage" class="form-control" required></div>
                            <div class="col-md-6"><label for="txtDoctorName" class="form-label">Doctor Name</label><input type="text" id="txtDoctorName" name="DoctorName" class="form-control" placeholder="Enter doctor name" required></div>
                            <div class="col-md-6"><label for="txtUsername" class="form-label">Username</label><input type="text" id="txtUsername" name="Username" class="form-control" placeholder="Enter username" required></div>
                            <div class="col-md-6"><label for="txtPassword" class="form-label">Password</label><input type="password" id="txtPassword" name="Password" class="form-control" placeholder="Enter password" required></div>
                            <div class="col-md-6"><label for="ddlSpecialization" class="form-label">Specialization</label><select id="ddlSpecialization" name="Specialization" class="form-select" required><option value="">Select</option><option>Cardiology</option><option>Dermatology</option><option>Neurology</option></select></div>
                            <div class="col-md-6"><label for="txtHospital" class="form-label">Hospital</label><input type="text" id="txtHospital" name="Hospital" class="form-control" placeholder="Enter hospital" required></div>
                            <div class="col-md-6"><label for="txtDegree" class="form-label">Degree</label><input type="text" id="txtDegree" name="Degree" class="form-control" placeholder="Enter degree" required></div>
                            <div class="col-md-6"><label for="txtExperience" class="form-label">Experience</label><input type="number" id="txtExperience" name="Experience" class="form-control" placeholder="Enter years" required></div>
                            <div class="col-md-6"><label for="txtFee" class="form-label">Fee</label><input type="number" id="txtFee" name="Fee" class="form-control" placeholder="Enter fee" required></div>
                            <div class="col-md-6"><label for="txtTimeSlots" class="form-label">Available Time Slots</label><input type="text" id="txtTimeSlots" name="TimeSlots" class="form-control" placeholder="e.g. 10:00 AM, 02:00 PM" required></div>
                            <div class="col-12"><label for="txtDescription" class="form-label">Description</label><textarea id="txtDescription" name="Description" class="form-control" rows="4" placeholder="Enter description" required></textarea></div>
                            <div class="col-12"><button type="submit" class="btn btn-primary rounded-pill px-4">Submit</button></div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
