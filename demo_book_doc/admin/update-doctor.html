<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Doctor | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 bg-dark text-white min-vh-100 p-4">
                <h4 class="fw-bold mb-4">Admin Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white active" href="add-doctor.html">Doctors</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="#">Appointments</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="#">Patients</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="login.html">Logout</a></li>
                </ul>
            </div>
            <div class="col-lg-10 p-4">
                <h2 class="fw-bold mb-4">Update Doctor</h2>
                <div class="card border-0 shadow rounded-4 p-4">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr><th>Doctor</th><th>Specialization</th><th>Hospital</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Dr. Sarah Khan</td><td>Cardiology</td><td>Apollo Hospital</td><td><button class="btn btn-sm btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#updateDoctorModal">Edit</button></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="updateDoctorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-4">
                <div class="modal-header">
                    <h5 class="modal-title">Update Doctor</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Doctor Name</label><input type="text" class="form-control" value="Dr. Sarah Khan"></div>
                            <div class="col-md-6"><label class="form-label">Specialization</label><input type="text" class="form-control" value="Cardiology"></div>
                            <div class="col-md-6"><label class="form-label">Hospital</label><input type="text" class="form-control" value="Apollo Hospital"></div>
                            <div class="col-md-6"><label class="form-label">Fee</label><input type="number" class="form-control" value="80"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
