<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointments | CareConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-2 bg-dark text-white min-vh-100 p-4">
                <h4 class="fw-bold mb-4">Doctor Panel</h4>
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white active" href="appointments.html">Appointments</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-white" href="login.html">Logout</a></li>
                </ul>
            </div>
            <div class="col-lg-10 p-4">
                <h2 class="fw-bold mb-4">Appointments</h2>
                <div class="card border-0 shadow rounded-4 p-4">
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                                <tr><th>Patient Name</th><th>Mobile</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th></tr>
                            </thead>
                            <tbody>
                                <tr><td>Ali Ahmed</td><td>03001234567</td><td>2026-08-01</td><td>10:00 AM</td><td><span class="badge bg-warning-subtle text-warning">Pending</span></td><td><button class="btn btn-sm btn-success rounded-pill">Approve</button> <button class="btn btn-sm btn-danger rounded-pill">Reject</button></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
